  entertainment:
    - Gaming Cafe
    - Pool Or Billiard Room
    - Amusement Arcade
    - Amusement Device (Permanent)
    - Cabaret
    - Bingo Game Operator
    - Commercial Lessor (Bingo/Games Of Chance)
  wholesale_industrial:
    - Wholesale Food Market
    - Storage Warehouse
    - Mini-Storage Company
    - Scrap Metal Processor
    - Scale Dealer/Repairer
    - Auction House
  # Rule-based checks (a product or law, not a business type). The business is a real
  # storefront, but its industry is unknown from this record.
  product_rule_checks:
    - Air Conditioning Law
    - Box Cutter
    - Imitation Gun
    - Laser Pointer Sales
    - Spray Paint Sls Mnor
    - Special Sale
    - Gift Certificate

default_group: other

