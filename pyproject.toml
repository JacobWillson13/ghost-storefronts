[project]
name = "ghost-storefronts"
version = "0.1.0"
description = "Inspection history, delayed closure records and closed-business predictions in New York City"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.8",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "shapely>=2.0",
    "altair>=6.3.0",
    "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
storefronts = "storefronts.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
analysis = [
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.51",
    "nbconvert>=7.0",
    "nbformat>=5.0",
    "joblib>=1.4",
    "numpy>=2.0",
    "scipy>=1.14",
    "ipykernel>=6.0",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storefronts"]

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# Notebook setup changes cwd before imports.
[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running MongoDB at MONGO_URI"]
